<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Hero</title>
    <link rel="stylesheet" href="CSS.css">
</head>

<body>
    <nav class="navbar">
        <h1 class="logo">
            MyBrand
        </h1>
        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Projects</a>
            <a href="#">Contact</a>
        </div>
        <button class="talk-btn">
            Let's Talk
        </button>
    </nav>
    <section class="hero">
        <div class="hero-container">
            <div class="hero-content">
                <p class="subtitle">
                    Hello, I'm a Developer
                </p>
                <h2>
                    I build modern
                    <span>digital experiences</span>
                </h2>
                <p class="description">
                    I create clean, responsive and user-friendly
                    websites using modern web technologies.
                </p>
                <button class="work-btn">
                    View My Work
                </button>
            </div>
            <div class="hero-image">
                <img src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?w=800" alt="Developer workspace">
            </div>
        </div>
    </section>
</body>

</html>
