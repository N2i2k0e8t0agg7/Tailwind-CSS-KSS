<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailwind Hero</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-black text-white">
    <nav class="flex flex-col gap-5 px-5 py-5 sm:px-8 md:flex-row md:items-center md:justify-between md:px-10">
        <h1 class="text-2xl font-bold">
            MyBrand
        </h1>
        <div class="flex flex-wrap gap-5 text-gray-300 sm:gap-8">
            <a href="#" class="hover:text-white">Home</a>
            <a href="#" class="hover:text-white">About</a>
            <a href="#" class="hover:text-white">Projects</a>
            <a href="#" class="hover:text-white">Contact</a>
        </div>
        <button class="w-fit rounded-lg bg-white px-5 py-2 text-black hover:bg-gray-200">
            Let's Talk
        </button>
    </nav>
    <section
        class="flex min-h-[calc(100vh-180px)] items-center px-5 py-12 sm:px-8 md:min-h-[calc(100vh-80px)] md:px-10">
        <div class="mx-auto grid w-full max-w-6xl items-center gap-12 md:grid-cols-2">
            <div class="text-center md:text-left">
                <p class="mb-4 text-blue-400">
                    Hello, I'm a Developer
                </p>
                <h2 class="mb-6 text-4xl font-bold leading-tight sm:text-5xl lg:text-6xl">
                    I build modern
                    <span class="text-blue-500">
                        digital experiences
                    </span>
                </h2>
                <p class="mb-8 text-base text-gray-400 sm:text-lg">
                    I create clean, responsive and user-friendly
                    websites using modern web technologies
                </p>
                <button class="rounded-lg bg-blue-600 px-6 py-3 hover:bg-blue-700">
                    View My Work
                </button>
            </div>
            <div class="flex justify-center">
                <img src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?w=800" alt="Developer workspace"
                    class="w-full max-w-sm rounded-2xl sm:max-w-md">
            </div>
        </div>
    </section>
</body>

</html>
